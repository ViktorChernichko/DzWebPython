{% extends 'layouts/base.html' %}

{% block content %}

    {% if reader %}
        <h1>Edit reader: {{ reader.full_name }}</h1>
    {% else %}
        <h1>Add reader</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'dz14:reader_list' %}">Cancel</a></p>

{% endblock %}
