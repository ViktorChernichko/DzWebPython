{% extends 'layouts/base.html' %}

{% block content %}

    {% if restaurant %}
        <h1>Edit restaurant: {{ restaurant.name }}</h1>
    {% else %}
        <h1>Add restaurant</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'dz13:restaurant_list' %}">Cancel</a></p>

{% endblock %}
